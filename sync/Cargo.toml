[package]
name = "lsm-sync"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
description = "Synchronous API for the lsm crate"
license.workspace = true
readme = "../README.md"
keywords = ["storage", "database", "async"]

[dependencies]
lsm.workspace = true
cfg-if.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "sync", "macros", "tracing"] }

[dev-dependencies]
env_logger.workspace = true
tempfile.workspace = true

[features]
default = ["snappy-compression", "bloom-filters"]
snappy-compression = ["lsm/snappy-compression"]
wisckey = ["lsm/wisckey"]
bloom-filters = ["lsm/bloom-filters"]

[[test]]
name = "basic"
path = "tests/basic.rs"

[[test]]
name = "reopen"
path = "tests/reopen.rs"
